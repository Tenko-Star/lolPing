[package]
name = "lolping-lite"
version = "0.1.1"
edition = "2024"
description = "lolPing Lite: Alt+? sends League's \"?\" ping to everyone on the LAN."
license = "MIT"
publish = false

[dependencies]
fastrand = "2"
if-addrs = "0.15"
log = { version = "0.4", features = ["std"] }
png = "0.18"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
